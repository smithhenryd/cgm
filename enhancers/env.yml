name: enhancers
channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.12
  - pandas
  - matplotlib
  - seaborn
  - tqdm
  - jupyter
  - ipykernel
  - pytest
  - h5py
  - pyfaidx
  - hydra-zen
  - wandb
  - plotly
  - gcc_linux-64
  - gxx_linux-64
  - sysroot_linux-64
  
  - pip 

  - pip:
      # Use extra-index-url to allow searching PyPI and PyTorch
      - "--extra-index-url https://download.pytorch.org/whl/cu124"
      
      # Deep Learning Framework
      - "torch==2.5.1+cu124"
      - "torchvision==0.20.1+cu124"
      - "torchaudio==2.5.1+cu124"
      
      - lightning
      - alphagenome-pytorch

      # Local editable installs
      - "-e ."
      - "-e .."